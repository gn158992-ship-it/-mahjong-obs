/* ---- win SFX: original files in sfx/<style>/ ; sfx=musicbox|wood|arcade (default wood), sfx=0 mute, vol=0..1 ---- */
const SFX_STYLES={musicbox:1,wood:1,arcade:1};
const SFX_NAMES=['star_whoosh','heart_ding','goal_finish'];
function sfxStyle(){
  const v=String(Q.get('sfx')||'wood').toLowerCase();
  if(v==='0'||v==='off'||v==='false'||v==='mute'||v==='none'||v==='no') return null;
  if(SFX_STYLES[v]) return v;
  return 'wood';
}
function sfxVol(){
  let v=Q.get('vol'); if(v==null||v==='') v=Q.get('volume');
  v=(v==null||v==='')?0.7:parseFloat(v);
  if(!(v>=0)) v=0.7;
  return Math.max(0,Math.min(1,v));
}
const sfxState={style:sfxStyle(),vol:sfxVol(),bufs:{},ready:false,played:{},ctx:null,master:null,log:[],loadError:null};
function sfxCtx(){
  if(!sfxState.style||sfxState.vol<=0) return null;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  if(!sfxState.ctx){
    sfxState.ctx=new AC();
    sfxState.master=sfxState.ctx.createGain();
    sfxState.master.gain.value=sfxState.vol;
    sfxState.master.connect(sfxState.ctx.destination);
  }
  if(sfxState.ctx.state==='suspended') sfxState.ctx.resume().catch(function(){});
  return sfxState.ctx;
}
function fetchSfxArray(style,name){
  const base='sfx/'+style+'/'+name;
  return fetch(base+'.ogg',{cache:'force-cache'}).then(function(r){
    if(!r.ok) throw new Error('ogg '+r.status);
    return r.arrayBuffer();
  }).catch(function(){
    return fetch(base+'.mp3',{cache:'force-cache'}).then(function(r){
      if(!r.ok) throw new Error('mp3 '+r.status);
      return r.arrayBuffer();
    });
  });
}
function loadSfx(){
  if(!sfxState.style||sfxState.vol<=0) return Promise.resolve();
  const ctx=sfxCtx();
  if(!ctx) return Promise.resolve();
  return Promise.all(SFX_NAMES.map(function(name){
    return fetchSfxArray(sfxState.style,name).then(function(arr){
      return ctx.decodeAudioData(arr.slice(0)).then(function(buf){ sfxState.bufs[name]=buf; });
    });
  })).then(function(){ sfxState.ready=true; }).catch(function(err){ sfxState.loadError=String(err&&err.message||err); });
}
function resetSfxFlags(){ sfxState.played={whoosh:false,ding:false,finish:false}; }
function playSfx(name){
  if(!sfxState.style||sfxState.vol<=0) return;
  const ctx=sfxCtx();
  const buf=sfxState.bufs[name];
  if(ctx&&buf){
    const src=ctx.createBufferSource();
    src.buffer=buf;
    src.connect(sfxState.master);
    src.start();
    sfxState.log.push({name:name,via:'webaudio',t:ctx.currentTime});
    return;
  }
  try{
    const a=new Audio('sfx/'+sfxState.style+'/'+name+'.ogg');
    a.volume=sfxState.vol;
    const go=a.play();
    if(go&&go.catch) go.catch(function(){
      const b=new Audio('sfx/'+sfxState.style+'/'+name+'.mp3');
      b.volume=sfxState.vol;
      b.play().catch(function(){});
    });
    sfxState.log.push({name:name,via:'html'});
  }catch(e){}
}
function tickSfx(t){
  if(!sfxState.style||sfxState.vol<=0) return;
  const fd=(S&&S.fxDelay)||0;
  const flyT=3.92+fd;
  if(!sfxState.played.whoosh&&t>=flyT-0.02){ sfxState.played.whoosh=true; playSfx('star_whoosh'); }
  const hits=S&&S.hits;
  const firstHit=(hits&&hits.length)?hits[0]:flyT+0.95;
  if(!sfxState.played.ding&&t>=firstHit){ sfxState.played.ding=true; playSfx('heart_ding'); }
  const fillT=(hits&&hits.length)?hits[hits.length-1]:firstHit+0.5;
  const stingT=Math.max(5.45,fillT);
  if(!sfxState.played.finish&&t>=stingT){ sfxState.played.finish=true; playSfx('goal_finish'); }
}

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));

function cubicBezier(x1,y1,x2,y2){
  function A(a,b){return 1-3*b+3*a;} function B(a,b){return 3*b-6*a;} function C(a){return 3*a;}
  function bez(t,a,b){return ((A(a,b)*t+B(a,b))*t+C(a))*t;}
  function slope(t,a,b){return 3*A(a,b)*t*t+2*B(a,b)*t+C(a);}
  return function(x){
    if(x<=0) return 0; if(x>=1) return 1;
    let t=x;
    for(let i=0;i<8;i++){
      const s=slope(t,x1,x2); if(Math.abs(s)<1e-6) break;
      const d=bez(t,x1,x2)-x; if(Math.abs(d)<1e-6) break;
      t-=d/s;
    }
    return bez(t,y1,y2);
  };
}

  let entranceLogged=false;
  const t0=performance.now();
  resetSfxFlags();
  try{ sfxCtx(); }catch(_){}
  const loop=now=>{
    const t=(now-t0)/1000;
    frames.push({t:+t.toFixed(4), now:+now.toFixed(2)});
    render(Math.min(t,winDur()));
    tickSfx(t);
    if(!entranceLogged && t>=0.55){
      entranceLogged=true;
      publishPerf(frames,tasks,false);
    }
    if(t<winDur()) raf=requestAnimationFrame(loop);
    else {
      disarmWillChange();
      if(po) try{po.disconnect();}catch(_){}
      publishPerf(frames,tasks,true);
      finishMainWin('done');
    }
  };
  raf=requestAnimationFrame(loop);
}
let winDoneResolve=null;
let winPlayToken=0;
let winOnDone=null;
function finishMainWin(reason){
  const r=winDoneResolve;
  winDoneResolve=null;
  if(r) r(reason||'done');
  /* Interrupt only resolves the previous Promise; the new caller callback must not run here. */
}
function fireOnWinDone(token, reason){
  if(token!==winPlayToken) return;
  const cb=winOnDone;
  winOnDone=null;
  try{ window.__WIN_PLAYING__=false; }catch(e){}
  if(typeof cb==='function') cb(reason);
}
/* v3.1：碰碰胡+清一色 → 預設兩字；單清一色／單碰碰胡用 words；混一色（含搭碰碰胡）→ hun。一律傳 rows+winner。 */
function ppqPlanFromItems(items){
  const names=(items||[]).map(function(it){ return Array.isArray(it)?it[0]:(it&&it.name); });
  const hasQing=names.indexOf('清一色')>=0;
  const hasPeng=names.indexOf('碰碰胡')>=0;
  const hasHun=names.indexOf('湊一色')>=0||names.indexOf('混一色')>=0;
  if(hasPeng && hasQing) return {kind:'qing'};
  if(hasHun){
    /* 一次只播一支。清一色+混一色（計分上互斥）時挑台數大的那支；碰碰胡+混一色仍播 hun。 */
    if(hasQing){
      let qTai=8, hTai=4;
      (items||[]).forEach(function(it){
        const n=Array.isArray(it)?it[0]:(it&&it.name);
        const v=Number(Array.isArray(it)?it[1]:(it&&it.tai));
        if(n==='清一色' && v===v) qTai=v;
        if((n==='湊一色'||n==='混一色') && v===v) hTai=v;
      });
      if(qTai>hTai) return {kind:'qing', words:['清一色']};
    }
    return {kind:'hun'};
  }
  if(hasQing) return {kind:'qing', words:['清一色']};
  if(hasPeng) return {kind:'qing', words:['碰碰胡']};
  return null;
}
function ppqKindFromItems(items){
  const p=ppqPlanFromItems(items);
  return p?p.kind:null;
}
window.ppqPlanFromItems=ppqPlanFromItems;
window.ppqKindFromItems=ppqKindFromItems;
function playPpqSub(D){
  const plan=ppqPlanFromItems(D&&D.items);
  if(!plan) return Promise.resolve('skip');
  const play=plan.kind==='qing'?window.playPengPengQing:window.playHunYiSe;
  if(typeof play!=='function') return Promise.resolve('unavailable');
  const opt={winner:(D&&D.winnerSeat)||'br', rows:(D&&D.items)||[]};
  if(plan.words) opt.words=plan.words;
  return play(opt);
}
window.playPpqSub=playPpqSub;
window.stopWin=function(){
  const token=winPlayToken;
  cancelAnimationFrame(raf);raf=null;disarmWillChange();
  finishMainWin('stopped');
  fireOnWinDone(token,'stopped');
};
window.renderAt=function(t){render(+t);};
window.playWin=function(data){
  if(winOff){
    hideStage();
    try{ window.__WIN_PLAYING__=false; }catch(e){}
    return Promise.resolve('blocked');
  }
  if(data) window.WIN_DATA=Object.assign({},window.WIN_DATA,data);
  cancelAnimationFrame(raf); raf=null;
  /* Interrupt the previous play's Promise only — do not fire the (possibly new) onWinDone. */
  finishMainWin('interrupted');
  hideStage();
  const token=++winPlayToken;
  try{ window.__WIN_PLAYING__=true; }catch(e){}
  winOnDone=window.onWinDone;
  const main=new Promise(function(resolve){ winDoneResolve=resolve; });
  const go=function(){
    build(window.WIN_DATA);
    render(0);
    flushStyle();
    requestAnimationFrame(function(){
      showStage();
      armWillChange();
      startWinLoop();
    });
  };
  if(shellReady) go();
  else preloadWinAssets().then(function(){ shellReady=true; go(); });
  /* v53.5：恢復正式版行為——主動畫（自摸／胡牌）結束後才播清一色／碰碰胡／混一色子動畫，
     主＋子都播完才觸發 onWinDone。直播 Overlay（obs.html）的結算區仍立刻列出大牌台數，不受影響。 */
  return main.then(function(reason){
    if(token!==winPlayToken) return reason;
    if(reason!=='done') return reason;
    return Promise.resolve(playPpqSub(window.WIN_DATA)).then(function(sub){
      if(token!==winPlayToken) return sub;
      fireOnWinDone(token,'done');
      return sub;
    });
  });
};
window.addEventListener('message',ev=>{const m=ev.data; if(m&&m.type==='win') playWin(m.data);});
if(Q.get('ws')){ (function conn(){const ws=new WebSocket(Q.get('ws'));ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='win')playWin(m.data);}catch(_){}};ws.onclose=()=>setTimeout(conn,3000);})(); }
preloadWinAssets().then(function(){
  hideStage();
  build(window.WIN_DATA);
  prewarmLayers();
  if(Q.has('t')) { showStage(); render(parseFloat(Q.get('t'))); }
  else if(Q.get('autoplay')==='1' || Q.get('demo')){ shellReady=true; showStage(); playWin(); if(Q.get('loop')==='1') setInterval(()=>playWin(),(winDur()+2)*1000); }
  else { render(-1); showStage(); } // 待機：只顯示四張卡
  shellReady=true;
  window.__ready=true;
  (function hookWinFlags(){
    var applyWinFlag=function(f){
      winOff=!!(f&&f.winAnim===false);
      document.documentElement.classList.toggle('live-win-off', winOff);
      document.body.classList.toggle('live-win-off', winOff);
      if(winOff){ try{ if(window.stopWin) window.stopWin(); }catch(e){} hideStage(); }
    };
    var src=null;
    try{ if(window.parent&&window.parent!==window&&window.parent.LiveFlags) src=window.parent.LiveFlags; }catch(e){}
    if(src){
      src.onChange(applyWinFlag);
      applyWinFlag(src.get());
      return;
    }
    window.addEventListener('message',function(ev){
      if(ev.origin!==location.origin) return;
      if(ev.source!==window.parent) return;
      var m=ev.data;
      if(m&&m.type==='liveFlags') applyWinFlag(m.flags||m);
    });
    /* 單獨開啟、沒有父頁 LiveFlags 時不輪詢。 */
  })();
  /* Prewarm sub-anim after the overlay is ready so normal wins are not delayed. */
  setTimeout(function(){
    try{ if(window.PPQ&&PPQ.prewarm) PPQ.prewarm('qing',{winner:'br',rows:[['碰碰胡',4],['清一色',8]]}); }catch(e){}
  }, 800);
});
</script></body></html>
