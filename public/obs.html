  </div>
  <div id="frame">
    <div id="stage">
      <div id="board" class="waiting">
        <svg id="live" viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>

      </div>
      <div id="draw-layer" aria-hidden="true"><span class="draw-word"></span></div>
      <div id="win-layer" aria-hidden="true">
        <iframe id="winanim" title="胡牌動畫" allowtransparency="true"></iframe>
      </div>
      <div id="duo-layer" aria-hidden="true"></div>
    </div>
  </div>
